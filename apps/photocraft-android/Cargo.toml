[package]
name = "photocraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android GameActivity host for PhotoCraft"

[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
eframe = { workspace = true, features = ["wgpu", "accesskit", "android-game-activity"] }
photocraft-engine = { workspace = true }
photocraft-ui-egui = { workspace = true }
# Keep this on the same pinned winit revision selected by the workspace patch.
# The AndroidApp type is re-exported here; do not add a second android-activity version.
winit = { version = "=0.30.13", default-features = false }

[lints]
workspace = true

# The Android ABI entrypoint needs one exported symbol. All other unsafe code remains denied;
# the only scoped allowance is in src/entrypoint.rs for the required symbol attribute.
[lints.rust]
unsafe_code = "deny"
